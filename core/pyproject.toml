[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentos"
version = "0.1.0"
description = "A deterministic runtime for AI workflow apps — generic Core, zero domain knowledge"
readme = "README.md"
# Upper bound is real, not caution: runtime/shell.py uses the stdlib `cgi`
# module for multipart uploads, and `cgi` was removed in Python 3.13. Lift this
# to <4 only after that import is replaced.
requires-python = ">=3.11,<3.13"
authors = [{ name = "Dekode1859", email = "prateekdwivedi30@gmail.com" }]
dependencies = [
    "pywebview>=4.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Playwright is never imported by Core at import time — it appears only inside
# the browser-agent payload string, which Core runs as a subprocess. Apps that
# call Bridge.browser_open need it installed in the interpreter Core spawns.
browser = ["playwright>=1.40.0"]

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

[tool.hatch.build.targets.sdist]
include = ["agentos", "README.md"]

# ui/ (app.js, index.html, style.css) and the module READMEs ship as package
# data — runtime/paths.py resolves them relative to the package dir, so they
# must land inside the installed package, not beside it.
[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
]
