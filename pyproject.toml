[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentos"
dynamic = ["version"]
description = "A deterministic runtime for AI workflow apps — generic Core, zero domain knowledge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Dekode1859", email = "prateekdwivedi30@gmail.com" }]
keywords = ["agents", "runtime", "desktop", "llm", "opencode", "pywebview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pywebview>=4.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Playwright is never imported by Core at import time — it appears only inside
# the browser-agent payload string, which Core runs as a subprocess. Apps that
# call Bridge.browser_open need it installed in the interpreter Core spawns.
browser = ["playwright>=1.40.0"]

[project.scripts]
# Provisioning only — AgentOS runs apps, it is not a CLI tool. This exists so
# the execution engine can be installed explicitly rather than downloaded
# implicitly at first launch.
agentos = "agentos.__main__:main"

[project.urls]
Homepage = "https://github.com/Dekode1859/AgentOS"
Repository = "https://github.com/Dekode1859/AgentOS"
Issues = "https://github.com/Dekode1859/AgentOS/issues"
Changelog = "https://github.com/Dekode1859/AgentOS/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# NOT Core dependencies. These belong to the frozen example apps under apps/,
# and exist here only so tests/test_swap_invariant.py can load those apps as a
# baseline: if a Core change stops them running, the swap invariant broke.
# Without these installed the learning-os half of that baseline silently skips.
apps = [
    "beautifulsoup4>=4.12.0",
    "ebooklib>=0.18",
    "markdownify>=0.13.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

# Single source of truth: the version lives in the package and the build reads
# it from there. Bump __version__ and the wheel follows.
[tool.hatch.version]
path = "agentos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

[tool.hatch.build.targets.sdist]
include = ["agentos", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

# ui/ (app.js, index.html, style.css) and the module READMEs ship as package
# data — runtime/paths.py resolves them relative to the package dir, so they
# must land inside the installed package, not beside it.
[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = [
    "app: characterization test that needs an application venv (bs4, pypdf, …); skipped when the dependency is absent",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["apps/*/.venv", "apps/*/.opencode-home", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines: prose docstrings and embedded JS payloads
    "B008",  # function call in default arg — not a pattern used here
]

[tool.ruff.lint.per-file-ignores]
# Apps deliberately mutate sys.path before importing agentos (monorepo layout),
# which forces module-level imports below statements.
"apps/*/main.py" = ["E402"]
"apps/*/app_bridge.py" = ["E402"]
"tests/*" = ["E402"]
